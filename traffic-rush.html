<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Traffic Rush — GamingBuzzz</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,sans-serif;touch-action:none}#g{height:100%;position:relative;display:flex;justify-content:center}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(94%,520px);display:flex;justify-content:space-between;z-index:2}.s{background:#08111dcc;border:1px solid #ffffff20;border-radius:12px;padding:6px 12px;text-align:center;min-width:78px}.s b{display:block;font-size:18px}.fuel{min-width:84px}.fuelbar{height:5px;background:#334052;border-radius:5px;overflow:hidden;margin:4px 0 3px}.fuelbar i{display:block;height:100%;width:100%;background:#35d07f;border-radius:5px;transition:width .15s}.s small{color:#aeb9c8;font-size:9px;letter-spacing:1.5px}.nitro{min-width:84px}.nitrobar{height:5px;background:#334052;border-radius:5px;overflow:hidden;margin:4px 0 3px}.nitrobar i{display:block;height:100%;width:100%;background:#32c8ff;border-radius:5px;transition:width .1s}.night{filter:saturate(.82) brightness(.72)}.rain{pointer-events:none;position:absolute;inset:0;z-index:1;opacity:.0}.nitrobtn{position:absolute;bottom:22px;left:calc(50% + 92px);width:78px;height:58px;border-radius:18px;border:1px solid #32c8ff55;background:#082032dd;color:#8de6ff;font-size:12px;font-weight:900;z-index:3}.nitrobtn:active{transform:scale(.94)}.police-alert{position:absolute;top:104px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#ff6972;opacity:0;z-index:4;white-space:nowrap;transition:.2s}.brand{position:absolute;top:73px;width:100%;text-align:center;font-size:11px;letter-spacing:3px;color:#cbd5e1aa}.controls{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:14px;z-index:3}.ctrl{width:78px;height:58px;border-radius:18px;border:1px solid #ffffff20;background:#08111dcc;color:#fff;font-size:24px}.ctrl:active{transform:scale(.94)}.hint{position:absolute;bottom:91px;width:100%;text-align:center;color:#aab5c4;font-size:11px}.overlay{position:absolute;inset:0;background:#03080fb8;display:flex;align-items:center;justify-content:center;z-index:5}.hide{display:none}.panel{width:min(88%,390px);padding:26px 22px 22px;border-radius:24px;background:linear-gradient(145deg,#17263a,#0b1524);border:1px solid #ffffff22;text-align:center;box-shadow:0 18px 70px #0008}h1{margin:0 0 6px;font-size:38px}.a{color:#ffd21a}.sub{color:#aeb9c8;font-size:14px;line-height:1.45;margin:0 0 18px}input{width:100%;padding:13px;border-radius:12px;border:1px solid #34465d;background:#091421;color:white;font-size:16px;margin-bottom:10px}button{font-weight:800;font-size:16px}.primary{width:100%;padding:13px;border:0;border-radius:13px;background:#ffd21a;color:#111}.secondary{width:100%;padding:13px;border:0;border-radius:13px;background:#22344d;color:#fff;margin-top:10px}.final{font-size:48px;font-weight:900;margin:7px}.tiny{font-size:12px;color:#9eabba}#toast{position:absolute;top:120px;left:50%;transform:translateX(-50%);font-weight:900;font-size:20px;opacity:0;z-index:6;transition:.15s}
</style></head><body><div id="g"><canvas id="c"></canvas><div class="hud"><div class="s"><b id="sc">0</b><small>SCORE</small></div><div class="s"><b id="sp">1.0x</b><small>SPEED</small></div><div class="s"><b id="be">0</b><small>BEST</small></div><div class="s fuel"><b id="fu">100%</b><div class="fuelbar"><i id="fb"></i></div><small>FUEL</small></div><div class="s nitro"><b id="ni">100%</b><div class="nitrobar"><i id="nb"></i></div><small>NITRO</small></div></div><div class="brand">GAMINGBUZZZ • TRAFFIC RUSH</div><div class="hint">← → keys or tap the buttons</div><div class="controls"><button class="ctrl" id="L">◀</button><button class="ctrl" id="R">▶</button></div><button class="nitrobtn" id="NIT">⚡ NITRO</button><div class="police-alert" id="pa">🚨 POLICE CHASE!</div><div class="rain" id="rain"></div><div id="toast"></div>
<div class="overlay" id="start"><div class="panel"><h1>TRAFFIC <span class="a">RUSH</span></h1><p class="sub">Dodge traffic, survive longer and earn bonus points for near misses.</p><input id="nm" maxlength="18" placeholder="Your name (optional)"><button class="primary" id="go">START RUSH 🚗</button><div class="tiny" style="margin-top:12px">The road gets faster as you survive.</div></div></div>
<div class="overlay hide" id="end"><div class="panel"><div class="tiny">TRAFFIC GOT YOU</div><div class="final" id="fs">0</div><div class="sub" id="rl">Great run!</div><button class="primary" id="again">RACE AGAIN</button><button class="secondary" id="share">SHARE CHALLENGE</button><button class="secondary" id="games">← MORE GAMES</button></div></div></div>
<script>
(()=>{const C=document.getElementById('c'),x=C.getContext('2d'),sc=document.getElementById('sc'),sp=document.getElementById('sp'),be=document.getElementById('be'),st=document.getElementById('start'),en=document.getElementById('end'),nm=document.getElementById('nm'),fs=document.getElementById('fs'),rl=document.getElementById('rl'),toast=document.getElementById('toast'),fu=document.getElementById('fu'),fb=document.getElementById('fb'),ni=document.getElementById('ni'),nb=document.getElementById('nb'),rain=document.getElementById('rain'),pa=document.getElementById('pa');let W,H,D,RX,RW,LW,p,obs=[],pumps=[],run=0,last=0,t=0,S=0,b=+localStorage.gbTR||0,spawn=0,fuel=100,nitroFuel=100,nitroOn=false,audio,engineOsc,engineGain,engineFilter,police=null,policeTimer=0,night=false,weatherTimer=0;
be.textContent=b;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0);RW=Math.min(W*.78,420);RX=(W-RW)/2;LW=RW/3;if(p){p.y=H-145;p.x=RX+LW*p.l+LW/2}}addEventListener('resize',size);size();
const rnd=(a,c)=>a+Math.random()*(c-a),cl=(v,a,c)=>Math.max(a,Math.min(c,v));
function ui(){let f=cl(fuel,0,100),n=cl(nitroFuel,0,100);fu.textContent=Math.ceil(f)+'%';fb.style.width=f+'%';fb.style.background=f<20?'#ff4d4d':f<40?'#ffd21a':'#35d07f';ni.textContent=Math.ceil(n)+'%';nb.style.width=n+'%';}
function ac(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function startEngine(){try{ac();if(!audio||engineOsc)return;engineOsc=audio.createOscillator();engineGain=audio.createGain();engineFilter=audio.createBiquadFilter();engineOsc.type='sawtooth';engineOsc.frequency.value=75;engineFilter.type='lowpass';engineFilter.frequency.value=280;engineGain.gain.value=.045;engineOsc.connect(engineFilter);engineFilter.connect(engineGain);engineGain.connect(audio.destination);engineOsc.start()}catch(e){}}
function engine(m){if(engineOsc&&audio){engineOsc.frequency.setTargetAtTime(58+m*24+(nitroOn?55:0),audio.currentTime,.05);engineGain.gain.setTargetAtTime(.038+m*.010+(nitroOn?.022:0),audio.currentTime,.06)}}
function stopEngine(){try{if(engineOsc)engineOsc.stop()}catch(e){}engineOsc=null;engineGain=null;engineFilter=null}
function snd(kind){try{ac();if(!audio)return;if(kind==='hit'){const now=audio.currentTime;for(const q of [{f:95,t:0,d:.24},{f:58,t:.06,d:.28},{f:220,t:.01,d:.09}]){let o=audio.createOscillator(),g=audio.createGain();o.type=q.f<100?'sawtooth':'square';o.frequency.setValueAtTime(q.f,now+q.t);o.frequency.exponentialRampToValueAtTime(Math.max(35,q.f*.45),now+q.t+q.d);g.gain.setValueAtTime(.0001,now+q.t);g.gain.exponentialRampToValueAtTime(.16,now+q.t+.015);g.gain.exponentialRampToValueAtTime(.001,now+q.t+q.d);o.connect(g);g.connect(audio.destination);o.start(now+q.t);o.stop(now+q.t+q.d+.02)}return}let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=kind==='near'?650:kind==='fuel'?900:kind==='nitro'?150:360;o.type=kind==='nitro'?'square':'sine';g.gain.setValueAtTime(kind==='nitro'?.09:.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+(kind==='nitro'?.28:.14));o.start();o.stop(audio.currentTime+(kind==='nitro'?.3:.15))}catch(e){}}
function move(d){if(!run)return;p.l=cl(p.l+d,0,2);p.x=RX+LW*p.l+LW/2;snd('move')}
function rr(q,y,w,h,r,c){x.beginPath();x.roundRect(q-w/2,y-h/2,w,h,r);x.fillStyle=c;x.fill()}
function car(q,y,w,h,c,me=false){x.save();x.translate(q,y);x.fillStyle='#0008';x.beginPath();x.ellipse(0,h*.48,w*.56,7,0,0,7);x.fill();
// wheels
x.fillStyle='#111';for(const wx of [-w*.5,w*.5]){x.beginPath();x.roundRect(wx-5,-h*.25,10,22,4);x.fill();x.beginPath();x.roundRect(wx-5,h*.18,10,22,4);x.fill()}
// body with more automotive shape
ctxBody();
function ctxBody(){let g=x.createLinearGradient(-w/2,0,w/2,0);g.addColorStop(0,c);g.addColorStop(.48,me?'#ffe45b':c);g.addColorStop(1,c);x.fillStyle=g;x.beginPath();x.moveTo(-w*.38,-h*.5);x.quadraticCurveTo(0,-h*.62,w*.38,-h*.5);x.lineTo(w*.48,h*.32);x.quadraticCurveTo(w*.5,h*.5,w*.28,h*.53);x.lineTo(-w*.28,h*.53);x.quadraticCurveTo(-w*.5,h*.5,-w*.48,h*.32);x.closePath();x.fill();}
// windows
x.fillStyle=me?'#203b50':'#152536';x.beginPath();x.moveTo(-w*.3,-h*.29);x.quadraticCurveTo(0,-h*.43,w*.3,-h*.29);x.lineTo(w*.23,-h*.03);x.lineTo(-w*.23,-h*.03);x.closePath();x.fill();x.fillStyle='#8fe5ff66';x.fillRect(-w*.19,-h*.23,w*.38,3);
// lights and grille
x.fillStyle=me?'#fff2a3':'#ff4d4d';rr(-w*.32,-h*.43,w*.17,7,3,x.fillStyle);rr(w*.32,-h*.43,w*.17,7,3,x.fillStyle);x.fillStyle='#15191d';x.fillRect(-w*.2,h*.27,w*.4,5);x.fillStyle='#fff';x.globalAlpha=.18;x.fillRect(-w*.28,-h*.5,w*.56,4);x.globalAlpha=1;if(me){x.fillStyle='#20262d';x.fillRect(-w*.08,h*.33,w*.16,7)}x.restore()}
function road(){x.fillStyle=night?'#061b11':'#0b351f';x.fillRect(0,0,W,H);
// city buildings
let bo=(t*95*(nitroOn?1.35:1))%150; for(let side=0;side<2;side++){let baseX=side?RX+RW+8:0;let endX=side?W:RX-8;let yy=-150+bo;let k=0;while(yy<H+160){let bw=side?Math.min(70,endX-baseX):Math.min(70,RX-baseX);bw=Math.max(38,bw);let bh=90+((k*47)%120);let bx=side?baseX:Math.max(0,RX-bw-8);let col=night?['#152433','#1b2b3a','#203044'][k%3]:['#6d7d8d','#7e8f9c','#596b7a'][k%3];x.fillStyle=col;x.fillRect(bx,yy,bw,bh);x.fillStyle=night?'#f7d66a':'#d9e7ef';for(let wy=yy+14;wy<yy+bh-10;wy+=22){for(let wx=bx+9;wx<bx+bw-7;wx+=17){if((k+Math.floor(wy/22)+Math.floor(wx/17))%3!==0)x.fillRect(wx,wy,6,8)}}yy+=bh+18;k++;}}
x.fillStyle=night?'#172331':'#263445';x.fillRect(RX,0,RW,H);x.fillStyle='#d8b83a';x.fillRect(RX-5,0,5,H);x.fillRect(RX+RW,0,5,H);x.fillStyle='#ffffff80';let off=(t*280*(nitroOn?1.45:1))%72;for(let l=1;l<3;l++)for(let y=-72+off;y<H;y+=72)x.fillRect(RX+LW*l-2,y,4,38);x.fillStyle=night?'#234528':'#315d34';for(let y=-30+(t*110)%80;y<H;y+=80){x.beginPath();x.arc(RX-35,y,10,0,7);x.fill();x.beginPath();x.arc(RX+RW+35,y+30,10,0,7);x.fill()}}
function add(){let l=Math.floor(Math.random()*3),cs=['#e84855','#3d8bfd','#ff9f1c','#9b5de5','#20c997','#f72585'];obs.push({l,x:RX+LW*l+LW/2,y:-100,w:LW*.53,h:72,c:cs[Math.floor(Math.random()*cs.length)],n:0})}
function addPump(){let l=Math.floor(Math.random()*3);pumps.push({l,x:RX+LW*l+LW/2,y:-90,w:LW*.46,h:58})}
function pumpDraw(q){x.save();x.translate(q.x,q.y);x.fillStyle='#0006';x.beginPath();x.ellipse(0,31,22,5,0,0,7);x.fill();rr(0,0,28,42,6,'#f4f4f4');rr(0,-12,22,10,4,'#e53935');x.fillStyle='#e53935';x.fillRect(-6,-1,12,10);x.fillStyle='#fff';x.font='14px Arial';x.textAlign='center';x.fillText('⛽',0,15);x.strokeStyle='#222';x.lineWidth=3;x.beginPath();x.moveTo(19,-10);x.lineTo(26,-16);x.lineTo(26,5);x.stroke();x.restore()}
function addPolice(){if(police)return;police={x:RX+LW*Math.floor(Math.random()*3)+LW/2,y:-110,w:LW*.54,h:78,phase:0};pa.style.opacity=1;setTimeout(()=>pa.style.opacity=0,1400);snd('near')}
function policeDraw(q){x.save();x.translate(q.x,q.y);rr(0,0,q.w,q.h,10,'#f4f4f4');x.fillStyle='#1d5fd1';x.fillRect(-q.w*.46,-q.h*.02,q.w*.92,q.h*.18);x.fillStyle='#111';x.beginPath();x.arc(-q.w*.32,q.h*.36,5,0,7);x.arc(q.w*.32,q.h*.36,5,0,7);x.fill();x.fillStyle=q.phase%2?'#e33':'#35a7ff';x.fillRect(-10,-q.h*.48,20,7);x.fillStyle='#182535';x.fillRect(-q.w*.3,-q.h*.27,q.w*.6,q.h*.22);x.restore()}
function msg(q){toast.textContent=q;toast.style.opacity=1;setTimeout(()=>toast.style.opacity=0,500)}
function boost(){if(!run||nitroFuel<=3||nitroOn)return;nitroOn=true;snd('nitro');let end=performance.now()+2400;function tick(){if(!run){nitroOn=false;return}nitroFuel-=.9;ui();if(nitroFuel>0&&performance.now()<end)requestAnimationFrame(tick);else nitroOn=false}tick()}
function start(){run=1;last=performance.now();t=0;S=0;fuel=100;nitroFuel=100;nitroOn=false;night=false;weatherTimer=0;police=null;obs=[];pumps=[];spawn=.2;p={l:1,x:RX+LW*1.5,y:H-145,w:LW*.62,h:86};ui();rain.style.opacity=0;startEngine();st.classList.add('hide');en.classList.add('hide');requestAnimationFrame(loop)}
function over(reason){run=0;stopEngine();snd('hit');fs.textContent=Math.floor(S);if(S>b){b=Math.floor(S);localStorage.gbTR=b;be.textContent=b;rl.textContent='🎉 NEW PERSONAL BEST!'}else rl.textContent=reason||((nm.value.trim()||'Player')+', your run is '+Math.floor(S)+' points.');en.classList.remove('hide')}
function loop(now){if(!run)return;let dt=Math.min((now-last)/1000,.035);last=now;t+=dt;let m=1+Math.min(t/55,1.8),base=220*m;night=t>18&&Math.floor(t/22)%2===1;weatherTimer+=dt;rain.style.opacity=(night&&Math.floor(t/22)%3===0)?.28:0;let v=base*(nitroOn?1.8:1);fuel-=dt*(1.65+m*.55);ui();engine(m);if(fuel<=0){fuel=0;ui();over((nm.value.trim()||'Player')+', you ran out of fuel! ⛽');return}
if(t>24&&!police&&Math.random()<dt*.035)addPolice();if(police){police.y+=v*dt*.92;police.phase=(police.phase+dt*12)|0;if(police.y>H+100)police=null;else if(Math.abs(police.x-p.x)<(police.w+p.w)*.39&&Math.abs(police.y-p.y)<(police.h+p.h)*.39){over('🚓 The police caught you!');return}}
spawn-=dt;if(spawn<=0){add();if(Math.random()<.34)addPump();spawn=Math.max(.42,1.02-t*.006)*rnd(.82,1.1)}road();
for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=v*dt;if(o.y>H+100){obs.splice(i,1);S+=10;continue}if(!o.n&&o.y>p.y-15&&o.y<p.y+45&&o.l!==p.l){o.n=1;S+=25;msg('NEAR MISS +25');snd('near')}if(Math.abs(o.x-p.x)<(o.w+p.w)*.39&&Math.abs(o.y-p.y)<(o.h+p.h)*.39){over();return}}
for(let i=pumps.length-1;i>=0;i--){let q=pumps[i];q.y+=v*dt*.9;if(q.y>H+90){pumps.splice(i,1);continue}if(Math.abs(q.x-p.x)<(q.w+p.w)*.42&&Math.abs(q.y-p.y)<(q.h+p.h)*.42){fuel=Math.min(100,fuel+45);S+=30;snd('fuel');msg('⛽ REFUELED +45');pumps.splice(i,1);ui()}}
S+=dt*(5+m*2)*(nitroOn?1.7:1);sc.textContent=Math.floor(S);sp.textContent=(m*(nitroOn?1.8:1)).toFixed(1)+'x';for(const o of obs)car(o.x,o.y,o.w,o.h,o.c);for(const q of pumps)pumpDraw(q);if(police)policeDraw(police);car(p.x,p.y,p.w,p.h,'#ffd21a',true);requestAnimationFrame(loop)}
document.getElementById('go').onclick=start;document.getElementById('again').onclick=start;document.getElementById('L').onclick=()=>move(-1);document.getElementById('R').onclick=()=>move(1);document.getElementById('NIT').onclick=boost;document.getElementById('games').onclick=()=>location.href='index.html';document.getElementById('share').onclick=async()=>{let q=`I scored ${Math.floor(S)} in Traffic Rush on GamingBuzzz. Can you beat me? 🚗💨`,u=location.href.split('?')[0]+'?challenge='+Math.floor(S);try{if(navigator.share)await navigator.share({title:'Traffic Rush Challenge',text:q,url:u});else{await navigator.clipboard.writeText(q+' '+u);msg('Challenge copied!')}}catch(e){}};addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){e.preventDefault();move(1)}if(e.code==='Space'){e.preventDefault();boost()}})})();
</script></body></html>
