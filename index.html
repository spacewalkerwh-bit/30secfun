<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tap Challenge</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#fff;min-height:100vh;display:grid;place-items:center}.game{width:min(760px,94vw)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:13px;font-weight:900;letter-spacing:2px;text-transform:lowercase;margin-bottom:3px;opacity:.8}.title{font-size:27px;font-weight:800}.sub{color:#aaa;font-size:13px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:800;cursor:pointer;background:#fff;color:#111}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.stat{background:#1b1b1b;border:1px solid #303030;border-radius:15px;text-align:center;padding:9px}.lab{font-size:10px;color:#999;letter-spacing:1px}.num{font-size:25px;font-weight:800}.arena{height:370px;position:relative;overflow:hidden;border:1px solid #333;border-radius:22px;background:radial-gradient(circle at 50% 45%,#202020,#111 70%);touch-action:manipulation}.hint{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-weight:700}.target{position:absolute;display:none;width:68px;height:68px;border:3px solid #fff;border-radius:50%;background:#252525;color:#fff;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 0 0 0 rgba(255,255,255,.25);transition:transform .06s}.target:active{transform:scale(.9)}.fx{position:absolute;inset:0;pointer-events:none}.scorecard{display:none;margin-top:12px;padding:16px;border:1px solid #333;border-radius:18px;background:#1b1b1b;text-align:center}.scorecard.show{display:block}.scorecard .small{font-size:11px;color:#999;letter-spacing:1px;text-transform:uppercase}.scorecard .big{font-size:36px;font-weight:900;margin:3px 0}.scorecard .challenge{font-size:13px;color:#aaa}.scorecard .actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}.scorecard button{border:1px solid #444;background:#fff;color:#111;border-radius:11px;padding:10px 15px;font-weight:800;cursor:pointer}.p{position:absolute;width:8px;height:8px;border-radius:2px;background:#fff;animation:explode .9s ease-out forwards}@keyframes explode{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.4);opacity:0}}.ring{position:absolute;left:50%;top:50%;width:30px;height:30px;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);animation:ring .65s ease-out forwards}@keyframes ring{to{width:330px;height:330px;opacity:0}}.balloon{position:absolute;width:30px;height:38px;border-radius:50% 50% 48% 48%;background:#fff;animation:balloon 1s ease-out forwards}.balloon:after{content:"";position:absolute;width:1px;height:28px;background:#aaa;top:35px;left:15px}@keyframes balloon{0%{transform:translateY(70px) scale(.3);opacity:0}35%{opacity:1}100%{transform:translateY(-280px) scale(1.15);opacity:0}}.flash{position:absolute;inset:15%;border-radius:50%;background:#fff;opacity:0;animation:flash .25s ease-out}@keyframes flash{0%{opacity:.6;transform:scale(.2)}100%{opacity:0;transform:scale(1.4)}}
</style></head><body><main class="game"><header><div><div class="brand">30secfun</div><div class="title">🎯 Tap Challenge</div><div class="sub" id="sub">30 seconds · Tap fast · Beat your best</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" id="share" type="button">SHARE CHALLENGE</button><button class="btn" id="start" type="button">START GAME</button></div></header><section class="stats"><div class="stat"><div class="lab">SCORE</div><div class="num" id="score">0</div></div><div class="stat"><div class="lab">TIME</div><div class="num" id="time">30</div></div><div class="stat"><div class="lab">BEST</div><div class="num" id="best">0</div></div></section><section class="arena" id="arena"><div class="hint" id="hint">Press START GAME</div><button class="target" id="target" aria-label="Tap">●</button><div class="fx" id="fx"></div></section><section class="scorecard" id="scorecard"><div class="small">Your Score</div><div class="big" id="cardScore">0</div><div class="challenge" id="cardText">Can your friend beat this score?</div><div class="actions"><button id="cardShare" type="button">🔗 SHARE CHALLENGE</button><button id="copyChallenge" type="button">📋 COPY LINK</button></div></section></main><script>
const $=id=>document.getElementById(id);let score=0,time=30,running=false,timer,audio;let best=Number(localStorage.getItem('tapBest')||0);$('best').textContent=best;let challengeScore=Number(new URLSearchParams(location.search).get('challenge')||0);if(challengeScore>0){$('sub').textContent='Beat '+challengeScore+' taps in 30 seconds!';$('share').textContent='SHARE CHALLENGE';}
function initAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function sound(freq=520,dur=.035,vol=.025,type='sine',when=0){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+when;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.01)}
function bigSound(level){let notes=level===25?[420,620,850]:level===50?[400,600,800,1050]:level===75?[350,550,800,1100,1450]:[300,500,750,1050,1400,1800];notes.forEach((n,i)=>sound(n,.18,.055,'triangle',i*.07))}
function move(){let a=$('arena'),t=$('target'),m=8;t.style.left=(m+Math.random()*(a.clientWidth-t.offsetWidth-2*m))+'px';t.style.top=(m+Math.random()*(a.clientHeight-t.offsetHeight-2*m))+'px';t.style.display='grid'}
function burst(level){bigSound(level);let f=$('fx'),r=document.createElement('div');r.className='ring';f.appendChild(r);let fl=document.createElement('div');fl.className='flash';f.appendChild(fl);let n=level===25?22:level===50?42:level===75?65:95;for(let i=0;i<n;i++){let p=document.createElement('i');p.className='p';p.style.left='50%';p.style.top='50%';p.style.setProperty('--x',(Math.random()*420-210)+'px');p.style.setProperty('--y',(Math.random()*350-175)+'px');p.style.setProperty('--r',(Math.random()*900-450)+'deg');f.appendChild(p)}if(level===50){for(let i=0;i<8;i++){let b=document.createElement('i');b.className='balloon';b.style.left=Math.random()*90+'%';b.style.top='90%';b.style.animationDelay=Math.random()*.35+'s';f.appendChild(b)}}if(level>=75){for(let j=0;j<(level===100?5:3);j++){let rr=document.createElement('div');rr.className='ring';rr.style.left=(20+Math.random()*60)+'%';rr.style.top=(20+Math.random()*50)+'%';rr.style.animationDelay=(j*.1)+'s';f.appendChild(rr)}}setTimeout(()=>f.replaceChildren(),1300)}
function makeLink(){let base=location.href.split('?')[0];return base+'?challenge='+Math.max(score,best,challengeScore,1)}
function shareData(){let targetScore=Math.max(score,best,challengeScore,1);let text=score>0?'I scored '+score+' taps in 30 seconds on 30secfun. Can you beat me? 🎯':'Can you beat '+targetScore+' taps in 30 seconds? 🎯 30secfun';return {link:makeLink(),text:text}}
async function shareChallenge(){let d=shareData();try{if(navigator.share){await navigator.share({title:'30secfun – Tap Challenge',text:d.text,url:d.link})}else{await navigator.clipboard.writeText(d.link);$('share').textContent='LINK COPIED';setTimeout(()=>$('share').textContent='SHARE CHALLENGE',1400)}}catch(e){try{await navigator.clipboard.writeText(d.link);$('share').textContent='LINK COPIED';setTimeout(()=>$('share').textContent='SHARE CHALLENGE',1400)}catch(err){prompt('Copy this challenge link:',d.link)}}}
async function copyChallenge(){let d=shareData();try{await navigator.clipboard.writeText(d.link);$('copyChallenge').textContent='COPIED ✓';setTimeout(()=>$('copyChallenge').textContent='📋 COPY LINK',1400)}catch(e){prompt('Copy this challenge link:',d.link)}}
function end(){running=false;clearInterval(timer);$('target').style.display='none';$('hint').style.display='grid';$('hint').textContent='TIME UP!';if(score>best){best=score;localStorage.setItem('tapBest',String(best));$('best').textContent=best}$('start').textContent='PLAY AGAIN';if(challengeScore>0){$('sub').textContent=score>=challengeScore?'Challenge beaten! 🎉':'Challenge: '+challengeScore+' taps · Try again!'}$('cardScore').textContent=score;$('cardText').textContent=challengeScore>0?(score>=challengeScore?'Challenge beaten! Send it back.':'Beat '+challengeScore+' taps to complete the challenge.'):'Send your score to a friend and challenge them.';$('scorecard').classList.add('show')}
$('start').onclick=()=>{initAudio();score=0;time=30;running=true;$('scorecard').classList.remove('show');$('score').textContent=0;$('time').textContent=30;$('hint').style.display='none';$('start').textContent='RUNNING...';move();clearInterval(timer);timer=setInterval(()=>{time--;$('time').textContent=time;if(time<=0)end()},1000)};
$('target').onpointerdown=e=>{e.preventDefault();if(!running)return;score++;$('score').textContent=score;sound(560,.028,.018);if([25,50,75,100].includes(score))burst(score);move()};
$('share').onclick=shareChallenge;$('cardShare').onclick=shareChallenge;$('copyChallenge').onclick=copyChallenge;
</script></body></html>
