<!doctype html>
<html lang="en">

<style>
:root{--bg:#080a0f;--panel:#11151d;--panel2:#171c26;--text:#f7f8fb;--muted:#8f98a8;--line:#252c38;--accent:#7c5cff;--good:#54d98c;--bad:#ff6b7a;--gold:#ffd166}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1a2030 0,#0b0d12 42%,#07090d 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px;user-select:none}
.app{width:min(430px,100%)}.brand{text-align:center;font-size:14px;font-weight:800;letter-spacing:.22em;color:#aab2c0;margin-bottom:10px}.title{text-align:center;font-size:29px;font-weight:850;letter-spacing:-.04em;margin:0}.sub{text-align:center;color:var(--muted);font-size:13px;margin:7px 0 18px}
.game{background:linear-gradient(180deg,rgba(24,29,40,.97),rgba(14,17,24,.98));border:1px solid var(--line);border-radius:25px;padding:14px;box-shadow:0 22px 60px rgba(0,0,0,.38);overflow:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:rgba(255,255,255,.035);border:1px solid #202633;border-radius:15px;text-align:center;padding:9px 4px}.label{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800}.value{font-size:21px;font-weight:850;margin-top:2px}.arena{height:410px;position:relative;border-radius:20px;background:linear-gradient(145deg,#0f131b,#090c11);border:1px solid #202632;display:flex;align-items:center;justify-content:center;overflow:hidden}.target{width:42px;height:42px;border:3px solid #fff;border-radius:50%;background:transparent;box-shadow:none;cursor:pointer;transition:transform .055s ease,filter .12s ease;touch-action:manipulation}.target:active{transform:scale(.91)}.target.hidden{display:none}.hint{position:absolute;color:#7f8999;font-size:13px;pointer-events:none}.player-badge{position:absolute;top:10px;right:12px;font-size:11px;color:#aab2c0;background:rgba(255,255,255,.045);border:1px solid #252c38;border-radius:999px;padding:5px 9px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:2}.controls{display:flex;gap:9px;margin-top:12px}.btn{flex:1;border:1px solid #2b3341;background:#191f29;color:#fff;border-radius:14px;padding:13px 12px;font-weight:800;font-size:13px;cursor:pointer}.btn.primary{background:#fff;color:#0b0d12;border-color:#fff}.btn:active{transform:scale(.98)}
.result{position:absolute;inset:0;background:rgba(8,10,15,.94);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}.result.show{display:flex}.result-inner{width:100%}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.14em;margin-bottom:8px}.headline{font-size:27px;font-weight:900;letter-spacing:-.035em}.headline.good{color:var(--good)}.headline.bad{color:var(--bad)}.headline.tie{color:var(--gold)}.scoreline{font-size:34px;font-weight:900;margin:13px 0 20px}.compare{display:flex;justify-content:center;gap:30px;margin-bottom:20px}.compare div{display:flex;flex-direction:column;gap:3px}.compare span{font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:800}.compare b{font-size:25px}.result-actions{display:flex;gap:9px}.result-actions .btn{min-width:0}.flash{position:absolute;inset:0;pointer-events:none;background:rgba(255,255,255,.08);opacity:0}.flash.on{animation:flash .22s ease}.shake{animation:shake .28s ease}.pop{animation:pop .35s ease}.confetti{position:absolute;width:6px;height:14px;border-radius:2px;pointer-events:none;animation:fall .8s ease-out forwards;z-index:8}
@keyframes flash{0%{opacity:0}35%{opacity:1}100%{opacity:0}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pop{0%{transform:scale(.9);opacity:.2}100%{transform:scale(1);opacity:1}}@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(260deg);opacity:0}}
.name-modal{position:fixed;inset:0;background:rgba(5,7,11,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.name-card{width:min(360px,100%);background:#11151d;border:1px solid #2a3140;border-radius:22px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.5);text-align:center}.name-card h2{margin:0;font-size:22px}.name-card p{color:var(--muted);font-size:13px;margin:7px 0 16px}.name-input{width:100%;border:1px solid #2b3341;background:#0b0e14;color:#fff;border-radius:13px;padding:13px 14px;font-size:15px;outline:none;text-align:center}.name-actions{display:flex;gap:9px;margin-top:12px}.name-actions .btn{min-width:0}.name-modal.hide{display:none}@media(max-height:700px){.arena{height:350px}}@media(max-width:360px){.arena{height:360px}.target{width:40px;height:40px}.title{font-size:26px}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">30SECFUN</div>
  <h1 class="title">🎯 Tap Challenge</h1>
  <div class="sub">30 seconds · Tap fast · Beat your best</div>
  <div class="game" id="gameBox">
    <div class="stats"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">TIME</div><div class="value" id="time">30</div></div><div class="stat"><div class="label">BEST</div><div class="value" id="best">0</div></div></div>
    <div class="arena" id="arena">
      <div class="player-badge" id="playerBadge"></div>
      <div class="hint" id="hint">Press START GAME</div>
      <button class="target hidden" id="target" aria-label="Tap"></button>
      <div class="flash" id="flash"></div>
      <div class="result" id="result"><div class="result-inner"><div class="eyebrow" id="resultEyebrow">TIME UP!</div><div class="headline" id="headline"></div><div class="scoreline" id="scoreline"></div><div class="compare" id="compare"></div><div class="result-actions"><button class="btn primary" id="againBtn">PLAY AGAIN</button><button class="btn" id="shareResultBtn">SHARE CHALLENGE</button></div></div></div>
    </div>
    <div class="controls"><button class="btn" id="shareTop">SHARE CHALLENGE</button><button class="btn primary" id="startBtn">START GAME</button></div>
  </div>
</div>
<div class="name-modal" id="nameModal"><div class="name-card"><h2>What should we call you?</h2><p>Your name is optional and will be used when you share a challenge.</p><input class="name-input" id="nameInput" maxlength="24" placeholder="Your name (optional)" autocomplete="nickname"><div class="name-actions"><button class="btn" id="skipName">SKIP</button><button class="btn primary" id="saveName">CONTINUE</button></div></div></div>
<script>
(() => {
 const $=id=>document.getElementById(id); const nameModal=$('nameModal'),nameInput=$('nameInput'),saveNameBtn=$('saveName'),skipNameBtn=$('skipName'),playerBadge=$('playerBadge'); const scoreEl=$('score'),timeEl=$('time'),bestEl=$('best'),target=$('target'),arena=$('arena'),hint=$('hint'),result=$('result'),headline=$('headline'),scoreline=$('scoreline'),compare=$('compare'),againBtn=$('againBtn'),shareTop=$('shareTop'),shareResultBtn=$('shareResultBtn'),startBtn=$('startBtn'),flash=$('flash');
 let score=0,time=30,running=false,timer=null,challenge=null,audioCtx=null;
 const savedName=(localStorage.getItem('tapPlayerName')||'').trim(); let playerName=savedName; function updateNameUI(){playerBadge.textContent=playerName?playerName:'';playerBadge.style.display=playerName?'block':'none';} function closeNameModal(){nameModal.classList.add('hide');updateNameUI();} if(savedName){nameInput.value=savedName;closeNameModal();} else {nameModal.classList.remove('hide');setTimeout(()=>nameInput.focus(),80);} saveNameBtn.addEventListener('click',()=>{playerName=nameInput.value.trim().slice(0,24);if(playerName)localStorage.setItem('tapPlayerName',playerName);closeNameModal();}); skipNameBtn.addEventListener('click',()=>{playerName='';localStorage.removeItem('tapPlayerName');closeNameModal();}); nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')saveNameBtn.click();});
 const saved=Number(localStorage.getItem('tapBest')||0); bestEl.textContent=saved;
 const params=new URLSearchParams(location.search); const challengeName=(params.get('name')||'').trim(); if(params.has('score')){const n=parseInt(params.get('score'),10);if(Number.isFinite(n)&&n>=0){challenge=n;hint.textContent=challengeName?challengeName+' challenged you · Can you beat '+n+'?':'Challenge loaded · Can you beat '+n+'?';startBtn.textContent='ACCEPT CHALLENGE';event('challenge_open',{challenge_score:n,has_name:!!challengeName});}}
 function event(name,data={}){try{if(window.gtag)window.gtag('event',name,data);window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:name,...data});}catch(e){}}
 function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume();}
 function tone(freq,dur,type='sine',vol=.018){try{audio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
 function tapSound(){tone(520,.035,'square',.012)} function milestoneSound(n){tone(500+n*2,.09,'sine',.035);setTimeout(()=>tone(760+n*2,.12,'sine',.025),55)}
 function resultSound(kind){if(kind==='win'){tone(620,.12,'sine',.04);setTimeout(()=>tone(880,.16,'sine',.04),80)}else if(kind==='lose'){tone(260,.14,'triangle',.035);setTimeout(()=>tone(190,.18,'triangle',.025),90)}else{tone(430,.11,'sine',.03);setTimeout(()=>tone(430,.11,'sine',.03),100)}}
 function moveTarget(){const pad=25, r=target.getBoundingClientRect(), ar=arena.getBoundingClientRect();const x=pad+Math.random()*Math.max(1,ar.width-r.width-pad*2),y=55+Math.random()*Math.max(1,ar.height-r.height-80);target.style.position='absolute';target.style.left=x+'px';target.style.top=y+'px';}
 function start(){audio();score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;hint.style.display='none';result.classList.remove('show');target.classList.remove('hidden');startBtn.textContent='RUNNING…';startBtn.disabled=true;shareTop.disabled=true;moveTarget();event('game_start',{mode:challenge!==null?'challenge':'normal',challenge_score:challenge??undefined});timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}
 function finish(){if(!running)return;running=false;clearInterval(timer);timer=null;target.classList.add('hidden');shareTop.disabled=false;startBtn.disabled=false;startBtn.textContent='START GAME';timeEl.textContent=0;event('game_complete',{score,mode:challenge!==null?'challenge':'normal'});showResult()}
 function showResult(){compare.innerHTML='';headline.className='headline';scoreline.textContent='';let kind='normal';if(challenge!==null){compare.innerHTML='<div><span>YOU</span><b>'+score+'</b></div><div><span>CHALLENGE</span><b>'+challenge+'</b></div>';if(score>challenge){headline.textContent='🏆 YOU WIN!';headline.classList.add('good');kind='win';event('challenge_win',{score,challenge_score:challenge})}else if(score<challenge){headline.textContent='😅 TRY AGAIN';headline.classList.add('bad');kind='lose';event('challenge_loss',{score,challenge_score:challenge})}else{headline.textContent="🤝 IT'S A TIE!";headline.classList.add('tie');kind='tie';event('challenge_tie',{score,challenge_score:challenge})}scoreline.textContent='Challenge complete';}
 else {const old=Number(localStorage.getItem('tapBest')||0);if(score>old){localStorage.setItem('tapBest',score);bestEl.textContent=score;headline.textContent='🎉 NEW PERSONAL BEST!';headline.classList.add('good');scoreline.textContent=score;event('personal_best',{score,old_best:old})}else{headline.textContent='GOOD RUN!';scoreline.textContent='Your score: '+score+' · Best: '+old;} }
 result.classList.add('show');result.querySelector('.result-inner').classList.remove('pop');void result.querySelector('.result-inner').offsetWidth;result.querySelector('.result-inner').classList.add('pop');resultSound(kind);if(kind==='win')celebrate();}
 function celebrate(){for(let i=0;i<22;i++){const c=document.createElement('i');c.className='confetti';c.style.left=(35+Math.random()*30)+'%';c.style.top='42%';c.style.setProperty('--x',((Math.random()-.5)*260)+'px');c.style.setProperty('--y',(80+Math.random()*180)+'px');c.style.transform='rotate('+Math.random()*180+'deg)';arena.appendChild(c);setTimeout(()=>c.remove(),850)}}
 function tap(){if(!running)return;score++;scoreEl.textContent=score;tapSound();if([50,100].includes(score)){milestoneSound(score);flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');}moveTarget()}
 async function share(){const shareScore=running?score:Number(score); const url=new URL(location.href);url.search=shareScore>0?'?score='+encodeURIComponent(shareScore)+(playerName?'&name='+encodeURIComponent(playerName):''):'';const text=shareScore>0?(playerName?playerName+' scored '+shareScore+' in Tap Challenge. Can you beat me?':'I scored '+shareScore+' in Tap Challenge. Can you beat me?'):'Beat my score in 30secfun Tap Challenge!';event('challenge_share',{score:shareScore,has_name:!!playerName});try{if(navigator.share){await navigator.share({title:'30secfun — Tap Challenge',text,url:url.href});}else{await navigator.clipboard.writeText(url.href);shareTop.textContent='LINK COPIED ✓';setTimeout(()=>shareTop.textContent='SHARE CHALLENGE',1300)}}catch(e){}}
 target.addEventListener('click',tap);startBtn.addEventListener('click',start);againBtn.addEventListener('click',()=>{event('play_again',{mode:challenge!==null?'challenge':'normal'});start()});shareTop.addEventListener('click',share);shareResultBtn.addEventListener('click',share);arena.addEventListener('animationend',()=>arena.classList.remove('shake'));
 // Result share is disabled for normal mode only visually by label change.
 if(challenge===null)shareResultBtn.textContent='SHARE SCORE';
})();
</script>
</body></html>
